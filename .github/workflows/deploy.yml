name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs `pages: write` and `id-token: write` for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Imports resolve case-sensitively
        # Windows and macOS resolve imports case-insensitively; Linux does not.
        run: npm run check:imports

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Schema and RPC tests
        # Runs the migrations and the SQL assertions against PGlite (Postgres
        # compiled to WASM), so the schema is exercised in CI without needing a
        # database service.
        run: npm run test:sql

      - name: Build
        env:
          # Public by design (RLS + SECURITY DEFINER guard everything). Stored
          # as repository *variables* so they stay out of committed source.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        # vite.config.ts reads GITHUB_REPOSITORY to derive `base`, so the
        # subpath can never drift from the repo name.
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
